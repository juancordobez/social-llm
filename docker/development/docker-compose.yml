version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: social-mimic-postgres
    environment:
      POSTGRES_DB: social_mimic_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - social-mimic-network
    
  redis:
    image: redis:7-alpine
    container_name: social-mimic-redis
    ports:
      - "6379:6379"
    networks:
      - social-mimic-network
      
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: social-mimic-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=DevPassword123!
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - social-mimic-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: social-mimic-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
    depends_on:
      - opensearch
    networks:
      - social-mimic-network

volumes:
  postgres_data:
  opensearch_data:

networks:
  social-mimic-network:
    driver: bridge
