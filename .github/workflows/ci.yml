# ============================================
# CI Pipeline - Tests & Lint
# ============================================
# Ejecuta en cada push y PR
# - Linting (ESLint)
# - Tests unitarios e integración
# - Coverage report

name: CI - Tests & Lint

on:
  push:
    branches: [dev, stg, main]
  pull_request:
    branches: [dev, stg, main]

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # Lint Job
  # ==========================================
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint --if-present
        continue-on-error: true

  # ==========================================
  # Test Job - Backend
  # ==========================================
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --coverage --passWithNoTests
        env:
          NODE_ENV: test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  # ==========================================
  # Test Job - Brain
  # ==========================================
  test-brain:
    name: 🧠 Test Brain
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install root dependencies
        run: npm ci

      - name: 🧠 Run brain tests
        run: |
          node brain/decision/lab/test-decision.js || true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile

  # ==========================================
  # Build Check
  # ==========================================
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🏗️ Build backend
        working-directory: backend
        run: npm run build --if-present

      - name: ✅ Build successful
        run: echo "Build completed successfully!"
